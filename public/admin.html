<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title>
<style>:root{color-scheme:dark}body{background:#060103;color:#f3e8ea;font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:1000px;margin:auto}
h1{color:#ff3b4f;font-size:22px}input,select,textarea{background:#12050a;border:1px solid #3d101a;color:#f3e8ea;padding:10px;font-size:15px;width:100%}
button{background:linear-gradient(#d3182f,#7d0a1c);border:0;color:#fff;padding:12px 16px;font-size:14px;cursor:pointer;margin:4px 4px 4px 0}button.g{background:#1d0a10;border:1px solid #3d101a}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 70px 70px auto;gap:6px;margin-bottom:8px;align-items:center}.o{border:1px solid #3d101a;padding:12px;margin:8px 0;background:#12050a}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .w{grid-column:1/3}}small{color:#a28b90}</style></head><body>
<h1>🦇 NOCTURNE · админ-панель</h1>
<div id="lg"><input id="pw" type="password" placeholder="Пароль"><button onclick="load()">Войти</button></div>
<div id="app" hidden><button onclick="tab(0)">Товары</button><button class="g" onclick="tab(1)">Заказы</button>
<div id="t0"><div id="pl"></div><button class="g" onclick="add()">+ Добавить товар</button><button onclick="save()">💾 Сохранить</button> <small id="ok"></small><p><small>Фото: вставь ссылку на картинку в поле «Фото URL». Пусто — покажется эмодзи.</small></p></div>
<div id="t1" hidden></div></div>
<script>
var pw,D,$=function(i){return document.getElementById(i)},ST={new:'🆕 Новый',acc:'✅ Принят',ship:'🚚 Отправлен',done:'🏁 Выполнен',cx:'❌ Отменён'};
function api(b){b.pw=pw;return fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(r.status===401){alert('Неверный пароль');throw 0}return r.json()})}
function load(){pw=$('pw').value;api({a:'get'}).then(function(d){D=d;$('lg').hidden=true;$('app').hidden=false;draw()})}
function tab(i){$('t0').hidden=i;$('t1').hidden=!i}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;')}
function draw(){
 $('pl').innerHTML=D.products.map(function(p,i){return '<div class="row"><input class="w" value="'+esc(p.name)+'" onchange="D.products['+i+'].name=this.value" placeholder="Название"><input value="'+esc(p.brand)+'" onchange="D.products['+i+'].brand=this.value" placeholder="Бренд"><select onchange="D.products['+i+'].cat=this.value"><option value="liq"'+(p.cat=='liq'?' selected':'')+'>Жидкость</option><option value="snus"'+(p.cat=='snus'?' selected':'')+'>SNUS</option><option value="pod"'+(p.cat=='pod'?' selected':'')+'>POD</option></select><input value="'+esc(p.vol)+'" onchange="D.products['+i+'].vol=this.value" placeholder="Объём"><input type="number" value="'+p.eur+'" onchange="D.products['+i+'].eur=+this.value" title="Цена €"><input type="number" value="'+p.qty+'" onchange="D.products['+i+'].qty=+this.value" title="Кол-во"><button class="g" onclick="D.products.splice('+i+',1);draw()">🗑</button><input class="w" value="'+esc(p.desc)+'" onchange="D.products['+i+'].desc=this.value" placeholder="Описание"><input value="'+esc(p.e)+'" onchange="D.products['+i+'].e=this.value" placeholder="Эмодзи"><input class="w" value="'+esc(p.img)+'" onchange="D.products['+i+'].img=this.value" placeholder="Фото URL"></div>'}).join('');
 $('t1').innerHTML=D.orders.length?D.orders.map(function(o){return '<div class="o"><b>№'+o.id+'</b> · '+esc(o.u)+' · '+ST[o.st]+' · '+o.t+' €<br>'+o.items.map(function(i){return esc(i.n)+' × '+i.q}).join(', ')+'<br><small>'+esc(o.addr)+' · '+new Date(o.ts).toLocaleString()+'</small><br>'+['acc','ship','done','cx'].map(function(s){return '<button class="g" onclick="st('+o.id+',\''+s+'\')">'+ST[s]+'</button>'}).join('')+'</div>'}).join(''):'Заказов пока нет'}
function add(){D.products.push({id:Date.now()%1e9,brand:'',cat:'liq',name:'Новый товар',desc:'',vol:'',eur:10,qty:0,e:'💧',img:''});draw()}
function save(){api({a:'save',products:D.products}).then(function(){$('ok').textContent='✅ Сохранено';setTimeout(function(){$('ok').textContent=''},2000)})}
function st(id,s){api({a:'status',id:id,s:s}).then(function(d){D.orders=d.orders;draw()})}
</script></body></html>
