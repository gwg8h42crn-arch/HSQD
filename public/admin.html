<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка · NIGHT DROP</title>
<style>:root{color-scheme:dark;--lime:#c8ff3c;--l:rgba(255,255,255,.1)}*{box-sizing:border-box}body{background:#07070b;color:#f4f4f8;font-family:system-ui,sans-serif;margin:0;padding:16px 16px 90px;max-width:900px;margin:auto}
h1{font-size:22px}h1 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);margin-right:8px}
input,select,textarea{background:#12121a;border:1px solid var(--l);color:#f4f4f8;padding:11px;font-size:15px;width:100%;border-radius:12px;font-family:inherit}input:focus,textarea:focus{outline:0;border-color:var(--lime)}
button{background:var(--lime);border:0;color:#000;padding:12px 18px;font-size:14px;font-weight:700;border-radius:99px;cursor:pointer;margin:4px 4px 4px 0}button.g{background:#1a1a24;color:#f4f4f8;border:1px solid var(--l)}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button.on{background:var(--lime);color:#000}.tabs button{background:#1a1a24;color:#f4f4f8}
.p{display:grid;grid-template-columns:96px 1fr;gap:12px;background:#0f0f17;border:1px solid var(--l);border-radius:20px;padding:12px;margin-bottom:10px}
.ph{position:relative;width:96px;height:96px;border-radius:16px;background:#1a1a24;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;cursor:pointer;border:1px dashed #555}.ph img{width:100%;height:100%;object-fit:cover}.ph small{position:absolute;bottom:0;left:0;right:0;background:#000b;font-size:11px;text-align:center;padding:3px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f .w{grid-column:1/3}.f label{font-size:11px;color:#8c8ca0}
.o{border:1px solid var(--l);border-radius:16px;padding:14px;margin:8px 0;background:#0f0f17;line-height:1.6}small,.m{color:#8c8ca0}.fx{position:fixed;bottom:0;left:0;right:0;background:#07070bf0;padding:12px 16px;border-top:1px solid var(--l);text-align:center}</style></head><body>
<h1><i></i>NIGHT DROP · админка</h1>
<div id="lg"><p class="m">Введи пароль из Vercel (ADMIN_PASSWORD)</p><input id="pw" type="password" placeholder="Пароль" onkeydown="if(event.key=='Enter')load()"><button onclick="load()">Войти</button></div>
<div id="app" hidden><div class="tabs"><button class="on" onclick="tab(0,this)">Товары</button><button onclick="tab(1,this)">Время и места</button><button onclick="tab(2,this)">Заказы</button></div>
<div id="t0"><div id="pl"></div><button class="g" onclick="add()">＋ Новый товар</button></div>
<div id="t1" hidden></div><div id="t2" hidden></div>
<div class="fx" id="fx"><button onclick="save()">💾 Сохранить товары</button> <span id="ok" class="m"></span></div></div>
<script>
var pw,D,$=function(i){return document.getElementById(i)},ST={new:'🆕 Новый',acc:'✅ Принят',ship:'🚚 Передан',done:'🏁 Выполнен',cx:'❌ Отменён'};
function api(b){b.pw=pw;return fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(r.status===401){alert('Неверный пароль');throw 0}return r.json()})}
function load(){pw=$('pw').value;api({a:'get'}).then(function(d){D=d;$('lg').hidden=true;$('app').hidden=false;draw()})}
function tab(i,b){[0,1,2].forEach(function(k){$('t'+k).hidden=k!=i});$('fx').hidden=i!=0;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function inp(i,k,l,w,t){return '<div'+(w?' class="w"':'')+'><label>'+l+'</label><input'+(t?' type="number"':'')+' value="'+esc(D.products[i][k])+'" onchange="D.products['+i+'].'+k+'=this.'+(t?'valueAsNumber':'value')+'"></div>'}
function draw(){
 $('pl').innerHTML=D.products.map(function(p,i){return '<div class="p"><div class="ph" onclick="document.getElementById(\'f'+i+'\').click()">'+(p.img?'<img src="'+esc(p.img)+'">':esc(p.e||'📷'))+'<small>'+(p.img?'сменить':'+ фото')+'</small></div><input type="file" id="f'+i+'" accept="image/*" hidden onchange="up('+i+',this.files[0])"><div class="f">'+inp(i,'name','Название',1)+inp(i,'brand','Бренд')+'<div><label>Раздел</label><select onchange="D.products['+i+'].cat=this.value"><option value="liq"'+(p.cat=='liq'?' selected':'')+'>Жидкость</option><option value="snus"'+(p.cat=='snus'?' selected':'')+'>SNUS</option><option value="pod"'+(p.cat=='pod'?' selected':'')+'>POD</option></select></div>'+inp(i,'eur','Цена €',0,1)+inp(i,'qty','Кол-во',0,1)+inp(i,'vol','Объём')+inp(i,'desc','Описание',1)+'<div class="w"><button class="g" onclick="if(confirm(\'Удалить?\')){D.products.splice('+i+',1);draw()}">🗑 Удалить</button>'+(p.img?'<button class="g" onclick="D.products['+i+'].img=\'\';draw()">Убрать фото</button>':'')+'</div></div></div>'}).join('');
 var c=D.cfg;$('t1').innerHTML='<p class="m">Эти настройки видны клиентам на сайте и в боте.</p><div class="f"><div><label>Открытие</label><input id="co" type="time" value="'+c.open+'"></div><div><label>Закрытие</label><input id="cc" type="time" value="'+c.close+'"></div><div><label>Шаг, минут</label><select id="cs">'+[15,30,45,60].map(function(x){return '<option'+(x==c.step?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div><label>Заказов на одно время</label><input id="cp" type="number" min="1" value="'+c.cap+'"></div><div><label>Дней вперёд</label><input id="cd" type="number" min="1" max="14" value="'+c.days+'"></div><div class="w"><label>Места выдачи (по одному в строке)</label><textarea id="cl" rows="4">'+esc(c.places.join('\n'))+'</textarea></div></div><button onclick="sc()">💾 Сохранить расписание</button> <span id="ok2" class="m"></span>';
 $('t2').innerHTML=D.orders.length?D.orders.map(function(o){var s=o.slot||{};return '<div class="o"><b>№'+o.id+'</b> · <a style="color:#c8ff3c" href="tg://user?id='+o.uid+'">'+esc(o.u)+'</a> · '+ST[o.st]+' · <b>'+o.t+' €</b><br>'+o.items.map(function(i){return esc(i.n)+' × '+i.q}).join(', ')+'<br>📍 '+esc(s.place)+' · 🕒 '+esc(s.date)+' '+esc(s.time)+'<br>'+['acc','ship','done','cx'].map(function(k){return '<button class="g" onclick="st('+o.id+',\''+k+'\')">'+ST[k]+'</button>'}).join('')+'</div>'}).join(''):'<p class="m">Заказов пока нет</p>'}
function add(){D.products.unshift({id:Date.now()%1e9,brand:'',cat:'liq',name:'Новый товар',desc:'',vol:'',eur:10,qty:0,e:'💧',img:''});draw()}
function msg(t){$('ok').textContent=t;setTimeout(function(){$('ok').textContent=''},2500)}
function save(){api({a:'save',products:D.products}).then(function(){msg('✅ Сохранено')})}
function sc(){api({a:'cfg',cfg:{open:$('co').value,close:$('cc').value,step:$('cs').value,cap:$('cp').value,days:$('cd').value,places:$('cl').value.split('\n').map(function(s){return s.trim()})}}).then(function(){$('ok2').textContent='✅ Сохранено';setTimeout(function(){$('ok2').textContent=''},2500)})}
function st(id,s){api({a:'status',id:id,s:s}).then(function(d){D.orders=d.orders;draw()})}
function up(i,f){if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
 msg('⏳ Загружаю фото…');api({a:'img',id:D.products[i].id,data:c.toDataURL('image/jpeg',.85)}).then(function(d){if(!d.url){msg('Фото слишком большое');return}D.products[i].img=d.url;draw();save()})};im.src=r.result};r.readAsDataURL(f)}
</script></body></html>
