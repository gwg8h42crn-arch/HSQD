<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Заказ · HOOD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--mag:#ff2d95;--cya:#19f0ff;--lim:#b8ff3c;--m:#8c8a9c;--ln:rgba(255,255,255,.1);color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:#050508;color:#eceaf2;font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:20px 16px 60px;background-image:radial-gradient(ellipse at 50% 0,#2a0f3a,transparent 60%),radial-gradient(ellipse at 100% 100%,#0a2a33,transparent 50%)}
.w{max-width:560px;margin:auto}.logo{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:3px;text-shadow:0 0 14px var(--mag);color:#fff;text-decoration:none;display:inline-block;margin:6px 0 22px}
.eb{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--mag);text-transform:uppercase}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:64px;line-height:.95;letter-spacing:2px;margin:6px 0 4px}
.stt{display:flex;margin:26px 0 8px}.stt div{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--m);text-transform:uppercase;position:relative}
.stt i{display:block;width:14px;height:14px;border-radius:50%;border:2px solid #ffffff40;margin:0 auto 8px;background:#050508;position:relative;z-index:2}
.stt div:not(:last-child):after{content:"";position:absolute;top:6px;left:50%;width:100%;height:2px;background:#ffffff25}
.stt .on i{border-color:var(--cya);background:var(--cya);box-shadow:0 0 14px var(--cya)}.stt .on{color:#fff}.stt .on:not(:last-child):after{background:var(--cya)}
.cx{border:1px solid var(--mag);color:#ffd3ec;background:#ff2d9518;padding:14px;margin:20px 0;font-family:'IBM Plex Mono',monospace;font-size:13px}
.card{border:1px solid var(--ln);background:linear-gradient(170deg,#12111c,#09080f);padding:20px;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row span{color:var(--m);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase}.row b{font-weight:500;text-align:right}
.tot{display:flex;justify-content:space-between;font-family:'Bebas Neue',sans-serif;font-size:38px;margin-top:6px}
.btn{display:block;width:100%;text-align:center;border:1px solid #ffffff50;background:#0a0a12;color:#fff;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;text-decoration:none;margin-top:10px;cursor:pointer;text-transform:uppercase}
.btn.p{border:0;background:linear-gradient(100deg,var(--mag),#8a5cff);box-shadow:0 0 30px #ff2d9566}.btn.d{border-color:var(--mag);color:#ffd3ec}
p.n{color:var(--m);font-size:13px;line-height:1.6;margin-top:14px;font-family:'IBM Plex Mono',monospace}
</style></head><body><div class="w"><a class="logo" href="/">HOOD</a><div id="v"><p class="n">Загрузка...</p></div></div>
<script>
var q=new URLSearchParams(location.search),ID=q.get('id'),KEY=q.get('key'),BOT='your_shop_bot',$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(n){n=Math.round(n*100)/100;return n%1?n.toFixed(2):String(n)}
var STEPS=[['new','Принят'],['acc','Подтверждён'],['ship','Передан'],['done','Выполнен']];
function draw(o){var i=STEPS.map(function(s){return s[0]}).indexOf(o.st),cx=o.st==='cx';
 var h='<div class="eb">заказ</div><h1>№'+o.id+'</h1>';
 h+=cx?'<div class="cx">Заказ отменён</div>':'<div class="stt">'+STEPS.map(function(s,k){return '<div class="'+(k<=i?'on':'')+'"><i></i>'+s[1]+'</div>'}).join('')+'</div>';
 h+='<div class="card">'+o.items.map(function(x){return '<div class="row"><b>'+esc(x.n)+'</b><span>× '+x.q+'</span></div>'}).join('')+'<div class="row"><span>Место</span><b>'+esc(o.slot.place)+'</b></div><div class="row"><span>Время</span><b>'+o.slot.date.split('-').reverse().slice(0,2).join('.')+' в '+esc(o.slot.time)+'</b></div>'+(o.pct?'<div class="row"><span>Скидка</span><b>'+o.pct+'%</b></div>':'')+'<div class="tot"><span>К оплате</span><span>'+fm(o.t)+' €</span></div></div>';
 if(!o.linked&&!cx)h+='<a class="btn" target="_blank" rel="noopener" href="https://t.me/'+BOT+'?start=o'+o.id+'_'+KEY+'">Получать статусы в Telegram</a>';
 if(o.st==='new'||o.st==='acc')h+='<button class="btn d" onclick="cancel()">Отменить заказ</button>';
 h+='<a class="btn p" href="/">В магазин</a><p class="n">Оплата при получении. Страница обновляется сама.</p>';$('v').innerHTML=h}
function load(){fetch('/api/order?id='+encodeURIComponent(ID)+'&key='+encodeURIComponent(KEY)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(draw).catch(function(){$('v').innerHTML='<div class="cx">Заказ не найден. Проверь ссылку.</div><a class="btn p" href="/">В магазин</a>'})}
function cancel(){if(!confirm('Отменить заказ?'))return;fetch('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'cancel',id:+ID,key:KEY})}).then(function(r){return r.json()}).then(function(d){if(d.error)alert(d.error);load()})}
load();setInterval(load,20000);
</script></body></html>
